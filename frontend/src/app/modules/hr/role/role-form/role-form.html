<form novalidate>
  <p-fluid class="grid grid-cols-12 gap-6 flex-wrap p-fluid pt-2">
    <div class="col-span-12">
      <p-floatlabel variant="on">
        <input
          [autofocus]="true"
          [class.ng-invalid]="isFieldInvalid(rootField.name!)"
          (blur)="normalizeName()"
          autocomplete="off"
          class="ng-dirty"
          [formField]="rootField.name!"
          id="name"
          pInputText
          type="text"
        />
        <label for="name">{{ 'common.label.identifier' | translate }}</label>
      </p-floatlabel>
      <small [class.text-red-500]="isFieldInvalid(rootField.name!)" class="text-surface-500 dark:text-surface-400">{{ 'hr.role_form.name_hint' | translate }}</small>
    </div>

    <div class="col-span-12">
      <p-floatlabel variant="on">
        <input
          [class.ng-invalid]="isFieldInvalid(rootField.description!)"
          autocomplete="off"
          class="ng-dirty"
          [formField]="rootField.description!"
          id="description"
          pInputText
          type="text"
        />
        <label for="description">{{ 'hr.role_form.description' | translate }}</label>
      </p-floatlabel>
    </div>
  </p-fluid>
  <app-dialog-footer [isSubmitting]="isSubmitting()" (cancelForm)="closeForm($event)" (saveForm)="onSubmit()"/>
</form>
